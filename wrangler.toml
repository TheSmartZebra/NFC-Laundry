name = "wcu-laundry"
main = "src/index.js"
compatibility_date = "2025-09-23"

# Static assets (CSS) are served straight from ./public; anything that does not
# match a file there falls through to the Worker in src/index.js.
[assets]
directory = "./public"

# Replace `id` with the KV namespace id printed by:
#   npx wrangler kv namespace create LAUNDRY
[[kv_namespaces]]
binding = "LAUNDRY"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Both admin settings are Worker secrets, never committed vars. Secrets survive
# redeploys; a [vars] block would publish the admin URL in this public repo.
#   npx wrangler secret put ADMIN_PATH        # e.g. svc-<random hex>
#   npx wrangler secret put ADMIN_PASSWORD
# Without ADMIN_PATH set, the admin page simply does not exist (404).
